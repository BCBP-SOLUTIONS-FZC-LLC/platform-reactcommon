# Shared setup for every job: pnpm (version from package.json's packageManager), Node (from
# .nvmrc) with the pnpm store cached, and a frozen-lockfile install (a stale pnpm-lock.yaml fails).
name: Setup
description: pnpm + Node + pnpm install --frozen-lockfile

inputs:
  working-directory:
    description: Repository root, when the checkout is not the workspace root
    required: false
    default: .

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        package_json_file: ${{ inputs.working-directory }}/package.json

    - name: Install Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: ${{ inputs.working-directory }}/.nvmrc
        cache: pnpm
        cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml

    - name: Install dependencies (frozen lockfile)
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if ! pnpm install --frozen-lockfile; then
          echo "::error file=pnpm-lock.yaml,title=Lock drift::pnpm-lock.yaml is stale for package.json — run 'pnpm install' and commit the result."
          exit 1
        fi
