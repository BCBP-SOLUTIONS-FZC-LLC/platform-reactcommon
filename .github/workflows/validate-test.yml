# Reusable workflow — test gate.
# The full Vitest suite (SDK, webpack-preset, eslint-plugin, examples, scripts) with coverage of the
# three packages' sources, and the coverage gate. Called by ci.yml and release.yml. Gates package,
# trivy, smoke, interop and release.
name: Validate / Test

"on":
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to check out (leave empty to use the caller ref)'
        type: string
        required: false
        default: ''
    outputs:
      pct:
        description: 'Statement coverage of packages/*/src, in percent'
        value: ${{ jobs.test.outputs.pct }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      pct: ${{ steps.gate.outputs.pct }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Setup
        uses: ./.github/actions/setup

      # Mandatory blocking gate: every test file, with v8 coverage of packages/*/src
      # (vitest.config.ts) written to coverage/coverage-summary.json.
      - name: Tests (coverage)
        run: pnpm test:coverage

      # Do not lower this threshold (statements of packages/*/src; 94.8% when it was set).
      - name: Coverage threshold gate (≥ 98%)
        id: gate
        env:
          COVERAGE_THRESHOLD: '98'
        run: bash .github/scripts/coverage-gate.sh

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-report-${{ github.sha }}
          path: coverage/
          if-no-files-found: ignore
          retention-days: 30
