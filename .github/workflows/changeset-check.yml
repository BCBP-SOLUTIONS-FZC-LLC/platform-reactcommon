# Pre-merge changeset check (platform-gincommon's changelog-check, for changesets).
# Fails if a PR changes what a package ships without adding a .changeset/*.md entry, so
# `pnpm changeset version` in the release PR always has the CHANGELOG text release.yml needs.
# A release PR (it edits packages/*/CHANGELOG.md and consumes the changesets) passes.
name: Changeset check

"on":
  pull_request:
    paths:
      - 'packages/*/src/**'
      - 'packages/*/package.json'
      - 'packages/frontend-sdk/contracts/**'
      - 'packages/frontend-sdk/subpaths.json'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  changeset:
    name: changeset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Changeset added in this PR
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Three dots: only this PR's changes since the merge base.
          changed=$(git diff --name-only --diff-filter=AMR "$BASE...$HEAD")
          if grep -qE '^packages/[^/]+/CHANGELOG\.md$' <<<"$changed"; then
            echo "Release PR (CHANGELOG.md updated by changeset version) — OK."
          elif grep -E '^\.changeset/[^/]+\.md$' <<<"$changed" | grep -qv '^\.changeset/README\.md$'; then
            echo "Changeset added in this PR — OK."
          else
            echo "::error title=Changeset missing::This PR changes a published package but adds no .changeset/*.md. Run 'pnpm changeset' and commit the file."
            exit 1
          fi
