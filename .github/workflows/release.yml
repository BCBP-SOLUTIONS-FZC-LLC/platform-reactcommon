# Release for https://github.com/BCBP-SOLUTIONS-FZC-LLC/platform-reactcommon
# Triggered by version tags (e.g. v1.0.0 or v1.0.0-alpha.1).
#
# Same pipeline as ci.yml — same job names, same gates, same order — run at the tagged commit,
# with a release front (tag, versions, CHANGELOG verification) and a release back (the GitHub
# Release). Mirrors platform-gincommon's release.yml:
#
#   verify ──┬─► validate-test ────┬──► interop ──────────────┐
#            ├─► package ──────────┼──► trivy ────────────────┤
#            │                     └──► smoke ────────────────┤──► publish
#            ├─► validate-quality ────────────────────────────┤
#            └─► validate-contracts ──────────────────────────┘
#
# One version for the three packages (changesets `fixed` group). To release:
#   1. a release PR runs `pnpm run version-packages` (changeset version: bumps all three packages and
#      consumes .changeset/*.md; exports:sync: the generated SDK version), turns [Unreleased] in
#      CHANGELOG.md into the version's section, and merges to main;
#   2. tag the merge commit vX.Y.Z (the version it set) and push the tag.
#
# Nothing is published until every gate has passed on the exact tarballs that ship: package packs
# them once, smoke tests those files, and publish attaches the same files (checksums re-computed
# after the artifact hand-off). checksums.txt (tarballs + SBOM) is Cosign keyless-signed with
# sign-blob in publish, after every gate, and its Sigstore bundle ships as
# checksums.txt.sigstore.json. Signer identity: release.yml@refs/tags/vX.Y.Z (or @refs/heads/main
# for a dispatch from main).
#
# Publishes a GitHub Release only (tarballs, SBOM, signed checksums); no npm registry yet. A
# registry publish, when one is chosen, is one more step in publish, after the signature check.
#
# workflow_dispatch: GitHub runs this file and the reusable validate-*.yml from the DISPATCHING
# ref, not from the tag, so verify refuses a dispatch unless github.ref is refs/heads/main or
# refs/tags/<the tag>. The tagged commit must also be reachable from origin/main.
name: Release

"on":
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0-alpha.1)'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  RELEASE_REF: ${{ github.event.inputs.tag || github.ref }}

jobs:
  # ── fail fast: a wrong tag, a version mismatch or a missing CHANGELOG section stops everything
  verify:
    name: Verify tag + versions + CHANGELOG
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      # Dispatch ref (main or the tag), HEAD == tag, tag reachable from origin/main, and all
      # three packages at the tag's version.
      - name: Verify release tag (dispatch ref, checkout, on main, versions)
        run: bash .github/scripts/verify-release-tag.sh

      # CHANGELOG.md has the tag's section (or, for a pre-release tag, its base version's).
      - name: Verify CHANGELOG entry exists
        run: bash .github/scripts/verify-changelog-entry.sh

  # ── same as ci.yml ────────────────────────────────────────────────────────
  validate-test:
    name: Validate / Test
    needs: verify
    uses: ./.github/workflows/validate-test.yml
    secrets: inherit
    with:
      ref: ${{ github.event.inputs.tag || github.ref }}

  validate-quality:
    name: Validate / Quality
    needs: verify
    uses: ./.github/workflows/validate-quality.yml
    secrets: inherit
    with:
      ref: ${{ github.event.inputs.tag || github.ref }}

  validate-contracts:
    name: Validate / Contracts
    needs: verify
    uses: ./.github/workflows/validate-contracts.yml
    secrets: inherit
    with:
      ref: ${{ github.event.inputs.tag || github.ref }}

  # ── same as ci.yml, at the tag: the tarballs that ship ───────────────────
  package:
    name: Package tarballs
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build packages
        run: pnpm --filter "./packages/*" build

      - name: Pack
        run: bash .github/scripts/pack-packages.sh

      - name: Upload tarballs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-${{ env.RELEASE_TAG }}
          path: dist-packages/
          if-no-files-found: error
          retention-days: 90

  # ── same as ci.yml ────────────────────────────────────────────────────────
  trivy:
    name: Trivy scan
    runs-on: ubuntu-latest
    needs: [verify, validate-test, package]
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Cache Trivy DB
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: /tmp/trivy-cache
          key: trivy-db-${{ runner.os }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      - name: Trivy scan — CRITICAL / HIGH / UNKNOWN
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH,UNKNOWN
          ignore-unfixed: true
          cache-dir: /tmp/trivy-cache

      - name: Trivy scan — SARIF upload
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'
          ignore-unfixed: true
          cache-dir: /tmp/trivy-cache

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif

      - name: Trivy SBOM — CycloneDX
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom.cyclonedx.json
          exit-code: '0'
          cache-dir: /tmp/trivy-cache

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ env.RELEASE_TAG }}
          path: sbom.cyclonedx.json
          retention-days: 90

  # ── same as ci.yml: the exact tarballs that ship ─────────────────────────
  smoke:
    name: Smoke tests
    runs-on: ubuntu-latest
    needs: [verify, validate-test, package]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Download tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages-${{ env.RELEASE_TAG }}
          path: dist-packages

      - name: Smoke tests
        run: bash .github/scripts/smoke-tests.sh

  # ── same as ci.yml ────────────────────────────────────────────────────────
  interop:
    name: Cross-language compatibility
    needs: validate-test
    uses: BCBP-SOLUTIONS-FZC-LLC/platform-interop-tests/.github/workflows/interop.yml@93e348183692fc684c6fbe719679d79ac28e291a # main 2026-10-30 (platform-interop-tests#9: pair 4, the frontend SDK)
    with:
      platform_reactcommon_ref: ${{ github.event.inputs.tag || github.ref_name }}
    secrets:
      gh_private_token: ${{ secrets.GO_PRIVATE_TOKEN }}

  # ── release-only: the GitHub Release ─────────────────────────────────────
  publish:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [verify, validate-test, validate-quality, validate-contracts, package, trivy, smoke, interop]
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write   # Cosign keyless sign-blob of checksums.txt
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Extract release notes from CHANGELOG.md
        env:
          REPO: ${{ github.repository }}
        run: bash .github/scripts/extract-release-notes.sh

      - name: Download tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages-${{ env.RELEASE_TAG }}
          path: .

      - name: Download SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-${{ env.RELEASE_TAG }}

      - name: Checksums
        run: bash .github/scripts/release-checksums.sh

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Signed after every gate has passed; the bundle (certificate, signature, Rekor entry)
      # ships as a release asset.
      - name: Sign checksums with Cosign
        run: cosign sign-blob --yes --bundle checksums.txt.sigstore.json checksums.txt

      - name: Verify checksums signature
        env:
          REPO: ${{ github.repository }}
        run: |
          cosign verify-blob \
            --bundle checksums.txt.sigstore.json \
            --certificate-identity-regexp "^https://github\.com/${REPO}/\.github/workflows/release\.yml@refs/(tags/v.+|heads/main)$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            checksums.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/create-github-release.sh
