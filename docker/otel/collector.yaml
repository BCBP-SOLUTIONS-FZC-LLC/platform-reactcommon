# OpenTelemetry Collector for the integrated stack: the sink every signal ends in.
#
# otlp   OTLP gRPC (Envoy, the Go services, the browser metrics from otel-aggregator) and OTLP/HTTP on
#        the default paths (the /csp-report Lambda, the browser traces and logs from otel-gateway).
#
# The browser does not reach it directly: /otel/* goes to otel-gateway, the reference configuration
# (examples/collector/gateway.yaml, then aggregator.yaml for metrics), as in production.
#
# Everything is written as OTLP JSON lines under /out (.state/otel), which the e2e suite reads.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4319

processors:
  batch:
    timeout: 500ms

exporters:
  file/traces:
    path: /out/traces.jsonl
  file/logs:
    path: /out/logs.jsonl
  file/metrics:
    path: /out/metrics.jsonl
  debug:
    verbosity: basic

service:
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [file/traces, debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [file/logs, debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [file/metrics]
