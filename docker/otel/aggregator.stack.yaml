# The stack's aggregator: examples/collector/aggregator.yaml, writing its cumulative metrics to the
# stack Collector (collector.yaml, which files them under .state/otel) instead of Mimir.
processors:
  batch:
    timeout: 500ms

exporters:
  otlp/collector:
    endpoint: otel-collector:4317
    tls:
      insecure: true

service:
  pipelines:
    metrics/browser:
      exporters: [otlp/collector]
